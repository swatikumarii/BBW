label.invoice.purchase=Cùng tạo nên thế giới hạnh phúc hơn nhờ sức mạnh diệu kỳ của hương thơm! Mục tiêu của chúng tôi là đưa tất cả sản phẩm đến tay bạn trong tình trạng tốt nhất. Nếu sản phẩm bạn nhận được bị hư hỏng, lỗi hoặc không đúng mẫu, vui lòng liên hệ với chúng tôi trong vòng 14 ngày kể từ thời điểm giao hàng. Chúng tôi luôn sẵn sàng hỗ trợ bạn. Chỉ chấp nhận hoàn hàng đối với các đơn hàng bị hư hỏng, lỗi hoặc không đúng mẫu. Không chấp nhận hoàn hàng với lý do thay đổi ý định. Không chấp nhận hoàn tiền tại cửa hàng đối với các sản phẩm đặt trực tuyến.
