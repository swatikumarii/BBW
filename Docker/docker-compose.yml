version: '3.2' # Specify a suitable compose file version

services:
  bbw:
    build:
      context: .
      args:
        USER_ID: "${USER_ID}"
        GROUP_ID: "${GROUP_ID}"
    tty: true
    stdin_open: true
    volumes:
      - type: bind
        source: ../
        target: /home/bath-and-body-works
    user: "${USER_INFO}"
